<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cálculos Trabalhistas</title>
<!--
  Versão portátil — esboço v0.1 · atualizada em 25/09/2026

  Arquivo único: abra com dois cliques, em qualquer navegador. Não instala
  nada, não precisa de internet e não envia dado nenhum para servidor — todo
  o cálculo acontece nesta página.

  Gerado por ferramenta/empacotar.mjs a partir do código-fonte. Não edite à
  mão: a próxima geração desfaz a edição, e o teste acusa a diferença.
-->
<style>
:root {
  /* Amarelo da marca. Sobre branco ele não tem contraste para texto, então
     serve de fundo e de borda, sempre com tinta escura por cima; para texto
     em fundo claro usamos --destaque-texto. */
  --destaque: #ffc600;
  --destaque-escuro: #c9a227;   /* dourado acinzentado, para bordas */
  --destaque-claro: #fdf6e0;    /* creme fosco, para fundos */
  --destaque-texto: #6b5400;

  --tinta: #1c1a17;
  --tinta-media: #57534e;
  --tinta-fraca: #a8a29e;
  --linha: #e7e5e4;
  --fundo: #faf8f4;
  --papel: #ffffff;
  --verde: #047857;
  --verde-claro: #ecfdf5;
  --vermelho: #b91c1c;
  --raio: 12px;
  --sombra: 0 1px 2px rgba(28, 26, 23, .05), 0 6px 18px -14px rgba(28, 26, 23, .18);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}

/* ------------------------------------------------------------------ topo */
.topo {
  background: var(--destaque);
  color: var(--tinta);
  padding: 20px 24px;
}
.topo__conteudo {
  max-width: 1220px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.topo__marca { display: flex; align-items: center; gap: 14px; }
.topo__logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: rgba(28,26,23,.1); border: 1px solid rgba(28,26,23,.18);
  display: grid; place-items: center; font-size: 24px; font-weight: 700;
}
.topo h1 { margin: 0; font-size: 20px; letter-spacing: -.2px; }
.topo p { margin: 2px 0 0; font-size: 13px; color: rgba(28,26,23,.66); }
.abas {
  max-width: 1220px; margin: 16px auto -20px; display: flex; gap: 4px;
}
.aba {
  color: rgba(28,26,23,.6); text-decoration: none; font-size: 13.5px; font-weight: 600;
  padding: 9px 16px; border-radius: 10px 10px 0 0; border: 1px solid transparent; border-bottom: none;
}
.aba:hover { background: rgba(28,26,23,.07); color: var(--tinta); }
.aba--ativa { background: var(--fundo); color: var(--tinta); border-color: var(--linha); }

.badge {
  background: rgba(28,26,23,.06); border: 1px solid rgba(28,26,23,.16);
  color: var(--destaque-texto); padding: 6px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap;
}

/* ---------------------------------------------------------------- página */
.pagina { max-width: 1220px; margin: 0 auto; padding: 24px; }

.aviso-cache {
  background: #fef5f5; border: 1px solid #fecaca; color: #991b1b;
  border-radius: var(--raio); padding: 12px 16px; margin: 0 0 20px; font-size: 13.5px;
}

.etapa {
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio);
  box-shadow: var(--sombra); padding: 20px 22px; margin-bottom: 20px;
}
.etapa h2 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
.etapa__num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--destaque); color: var(--tinta);
  border: 1px solid var(--destaque-escuro);
  display: grid; place-items: center; font-size: 13px;
}
.etapa__ajuda { margin: 0 0 16px; color: var(--tinta-media); font-size: 13.5px; }

/* --------------------------------------------------------- cards de tipo */
.tipos-grupos { display: flex; flex-direction: column; gap: 18px; }
.grupo-tipos__titulo {
  margin: 0 0 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--tinta-fraca);
}
.grupo-tipos__ajuda { text-transform: none; letter-spacing: 0; font-weight: 400; }
.tipos { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tipo {
  text-align: left; cursor: pointer; background: var(--papel);
  border: 1.5px solid var(--linha); border-radius: var(--raio); padding: 14px;
  font: inherit; color: inherit; transition: .15s;
}
.tipo:hover { border-color: var(--destaque-escuro); background: #fdfbf5; }
.tipo[aria-checked="true"] { border-color: var(--destaque-escuro); background: var(--destaque-claro); box-shadow: 0 0 0 3px rgba(201,162,39,.22); }
.tipo:disabled { cursor: default; }
.tipo--breve { background: #fbfaf8; border-style: dashed; opacity: .65; }
.tipo--breve:hover { border-color: var(--linha); background: #fbfaf8; }
.tipo--breve .tipo__tag { text-transform: uppercase; letter-spacing: .5px; font-size: 10.5px; }
.tipo__icone { font-size: 20px; }
.tipo__nome { display: block; font-weight: 650; margin: 6px 0 2px; font-size: 14.5px; }
.tipo__tag { display: block; font-size: 12px; color: var(--tinta-media); }

.resumo-tipo {
  margin-top: 16px; border: 1px solid var(--linha); border-left: 3px solid var(--destaque);
  background: #fdfbf3; border-radius: 10px; padding: 14px 16px;
}
.resumo-tipo p { margin: 0 0 10px; font-size: 13.5px; color: var(--tinta-media); }
.verbas { display: flex; flex-wrap: wrap; gap: 8px; }
.verba {
  font-size: 12.5px; padding: 5px 10px; border-radius: 999px;
  background: var(--verde-claro); color: var(--verde); border: 1px solid #a7f3d0;
}
.verba--nao { background: #fef2f2; color: var(--vermelho); border-color: #fecaca; text-decoration: none; }
.verba small { opacity: .8; }

/* --------------------------------------------------------------- colunas */
.colunas { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(330px, .8fr); gap: 20px; align-items: start; }

/* ------------------------------------------------------------ formulário */
.grupo { border: none; border-top: 1px solid var(--linha); padding: 16px 0 4px; margin: 0; }
.grupo:first-of-type { border-top: none; padding-top: 4px; }
.grupo legend {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
  color: var(--destaque-texto); padding: 0;
}
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo--largo { grid-column: 1 / -1; }
.campo__rotulo { font-size: 13px; font-weight: 600; color: var(--tinta); }
.campo__rotulo b { color: var(--vermelho); }
.campo__dica { font-size: 11.5px; color: var(--tinta-fraca); }
.campo input {
  font: inherit; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 9px;
  background: #fff; color: var(--tinta); width: 100%;
}
.campo select {
  font: inherit; padding: 9px 11px; border: 1px solid #d6d3d1; border-radius: 9px;
  background: #fff; color: var(--tinta); width: 100%;
}
.campo select:focus, .campo input:focus { outline: none; border-color: var(--destaque-escuro); box-shadow: 0 0 0 3px rgba(201,162,39,.22); }
.campo--erro input { border-color: #dc2626; background: #fff7f7; }
.campo--erro input:focus { box-shadow: 0 0 0 3px rgba(220,38,38,.14); border-color: #dc2626; }
.campo__erro { font-size: 11.5px; color: var(--vermelho); font-weight: 600; }

.campo__moeda { position: relative; display: block; }
.campo__moeda i {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  font-style: normal; font-size: 13px; color: var(--tinta-fraca);
}
.campo__moeda input { padding-left: 36px; }
.campo__moeda--sufixo i { left: auto; right: 12px; }
.campo__moeda--sufixo input { padding-left: 11px; padding-right: 32px; }

.opcoes { border: none; padding: 0; margin: 0; }
.opcoes__lista { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
.opcao {
  display: flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap;
  border: 1.5px solid var(--linha); border-radius: 9px; padding: 8px 12px; cursor: pointer; background: #fff;
}
.opcao:has(input:checked) { border-color: var(--destaque-escuro); background: var(--destaque-claro); color: var(--tinta); font-weight: 600; }
.opcao input { accent-color: var(--destaque-escuro); margin: 0; }

.checkbox { flex-direction: row; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--tinta-media); cursor: pointer; }
.checkbox input { width: auto; margin-top: 2px; accent-color: var(--destaque-escuro); }
.checkbox b { color: var(--tinta); }

.nota-remuneracao {
  margin: 12px 0 0; font-size: 13px; color: var(--tinta-media);
  background: var(--destaque-claro); border-radius: 9px; padding: 8px 12px; display: inline-block;
}
.nota-remuneracao b { color: var(--destaque-texto); }

.acoes { display: flex; gap: 12px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
.acoes__nota { font-size: 12.5px; color: var(--tinta-fraca); }
.botao {
  font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 9px;
  border: 1px solid var(--linha); background: #fff; color: var(--tinta-media); cursor: pointer;
}
.botao--primario { background: var(--destaque); border-color: var(--destaque-escuro); color: var(--tinta); }
.botao--primario:hover { background: var(--destaque-escuro); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.botao:disabled:hover { background: var(--destaque); }

/* ---------------------------------------------------------------- painel */
.painel {
  background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio);
  box-shadow: var(--sombra); padding: 18px 20px; position: sticky; top: 20px;
}
.painel__topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.painel__topo h2 { margin: 0; font-size: 16px; }
.painel__tag {
  font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
  background: var(--destaque-claro); color: var(--destaque-texto); border: 1px solid var(--destaque);
  padding: 3px 9px; border-radius: 999px;
}
.alerta {
  background: #fdfbf3; border: 1px solid var(--linha); border-left: 3px solid var(--destaque-escuro);
  color: var(--tinta-media); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; margin-top: 12px;
}

/* Recorte: o cálculo acontece, mas só sobre o período imprescrito. */
.recorte {
  background: #fff7ed; border: 1px solid #fdba74; border-left: 4px solid #c2410c;
  color: #7c2d12; border-radius: 10px; padding: 12px 14px; margin-top: 12px;
}
.recorte b { display: block; margin-bottom: 4px; font-size: 13.5px; }
.recorte p { margin: 0; font-size: 12.5px; }

/* Impedimento: o cálculo não acontece, e a tela precisa dizer isso sem meio-termo. */
.impedimento {
  background: #fef2f2; border: 1px solid var(--vermelho); border-left-width: 4px;
  color: #7f1d1d; border-radius: 10px; padding: 14px 16px; margin-top: 12px;
}
.impedimento b { display: block; margin-bottom: 6px; font-size: 14px; }
.impedimento p { margin: 0; font-size: 13px; }
.impedimento__saida { margin-top: 8px !important; color: #991b1b; }

/* Tela travada pela prescrição: esmaece o que de fato está bloqueado, e não
   um grupo pela posição. As datas que afastam o impedimento moram em mais de
   um grupo (na rescisão, o ajuizamento fica no segundo), e um campo livre com
   cara de travado faria a pessoa desistir justamente dele. */
.formulario--bloqueado .grupo:not(:has(input:enabled, select:enabled)) { opacity: .5; }
.formulario--bloqueado .grupo:has(input:enabled, select:enabled) .campo:has(input:disabled, select:disabled) { opacity: .5; }
.campo input:disabled, .campo select:disabled { background: #f5f5f4; color: var(--tinta-fraca); cursor: not-allowed; }
.opcao:has(input:disabled) { cursor: not-allowed; }

.aviso-erro {
  background: #fef5f5; border: 1px solid #fecaca; color: #991b1b;
  border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-top: 12px;
}
.aviso-erro ul { margin: 6px 0 0; padding-left: 18px; }

.contexto { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.contexto div { background: #faf9f7; border: 1px solid var(--linha); border-radius: 9px; padding: 8px 10px; }
.contexto dt { font-size: 11px; color: var(--tinta-fraca); text-transform: uppercase; letter-spacing: .4px; }
.contexto dd { margin: 2px 0 0; font-size: 13px; font-weight: 600; }

.bloco-titulo {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
  color: var(--tinta-fraca); margin: 16px 0 6px;
}
/* Campo reescrito pela tela (o qualificador que acompanha o percentual). */
.campo--ajustado select, .campo--ajustado input { animation: ajustado 1.6s ease-out; }
@keyframes ajustado {
  0%, 35% { border-color: var(--destaque-escuro); box-shadow: 0 0 0 3px rgba(255, 198, 0, .45); }
  100% { box-shadow: 0 0 0 0 rgba(255, 198, 0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .campo--ajustado select, .campo--ajustado input { animation: none; }
}

.linhas { width: 100%; border-collapse: collapse; }
.linhas td { padding: 6px 0; border-bottom: 1px dashed var(--linha); font-size: 13.5px; vertical-align: top; }
.linhas td:last-child { padding-left: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.linhas small { display: block; color: var(--tinta-fraca); font-size: 11.5px; font-weight: 400; }
.linhas .neg td:last-child { color: var(--vermelho); }
.linhas tr.total td { border-bottom: none; padding-top: 10px; font-weight: 700; }

.liquido {
  margin-top: 14px; background: var(--destaque-claro); border: 1px solid var(--destaque);
  border-radius: 10px; padding: 12px 14px; display: flex; align-items: baseline; justify-content: space-between;
}
.liquido span { font-size: 12.5px; color: var(--destaque-texto); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.liquido b { font-size: 22px; color: var(--tinta); font-variant-numeric: tabular-nums; }

.fgts-card { margin-top: 14px; border: 1px solid var(--linha); border-radius: 10px; padding: 12px 14px; background: #faf9f7; }
.fgts-card h3 { margin: 0 0 8px; font-size: 13px; }
.fgts-card .linhas td { border-bottom: 1px dashed #ebe8e4; }
.fgts-card p { margin: 8px 0 0; font-size: 11.5px; color: var(--tinta-fraca); }
.fgts-card__nota { font-size: 12.5px !important; color: var(--tinta-media) !important; margin-top: 0 !important; }

.vazio { color: var(--tinta-fraca); font-size: 13.5px; margin-top: 14px; }
.observacao { margin: 10px 0 0; font-size: 11.5px; color: var(--tinta-fraca); }

/* --------------------------------------------------------------- rodapé */
.rodape { max-width: 1220px; margin: 0 auto; padding: 8px 24px 40px; color: var(--tinta-fraca); font-size: 12px; }
.rodape p { margin: 4px 0; }

@media (max-width: 1080px) {
  .colunas { grid-template-columns: 1fr; }
  .tipos { grid-template-columns: repeat(2, 1fr); }
  .painel { position: static; }
}
@media (max-width: 620px) {
  .tipos, .campos, .contexto { grid-template-columns: 1fr; }
}

/* ------------------------------------------------- memória de cálculo ---- */
/* Bloco montado só para a impressão: invisível na tela, único visível no papel. */
.memoria { display: none; }
.memoria__topo { border-bottom: 2px solid var(--tinta); padding-bottom: 8px; margin-bottom: 16px; }
.memoria__topo h1 { margin: 0; font-size: 18px; }
.memoria__topo p { margin: 2px 0 0; font-size: 13px; }
.memoria__data { color: var(--tinta-media); }
.memoria h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
  margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--linha);
}
.memoria__dados { width: 100%; border-collapse: collapse; }
.memoria__dados td { padding: 4px 0; font-size: 12.5px; border-bottom: 1px dotted var(--linha); }
.memoria__dados td:last-child { text-align: right; font-weight: 600; }
.memoria__rodape p { margin: 0 0 4px; }
.memoria__rodape { margin-top: 18px; padding-top: 8px; border-top: 1px solid var(--linha); font-size: 11px; color: var(--tinta-media); }

@media print {
  @page { margin: 14mm; }
  body { background: #fff; font-size: 12px; }
  .topo, .abas, .pagina, .rodape, .aviso-cache { display: none !important; }
  .memoria { display: block; }
  .memoria .contexto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .memoria .contexto div { border: 1px solid var(--linha); background: none; }
  .memoria .liquido { border: 2px solid var(--tinta); background: none; }
  .memoria .liquido b, .memoria .liquido span { color: var(--tinta); }
  .memoria .alerta, .memoria .fgts-card { background: none; }
  .memoria .bloco-titulo { color: var(--tinta); }
  /* Cinza claro some no papel. */
  .memoria .contexto dt, .memoria .linhas small, .memoria .fgts-card p { color: var(--tinta-media); }
  .memoria table, .memoria .fgts-card, .memoria .liquido { break-inside: avoid; }
  .memoria section { break-inside: avoid-page; }
}
</style>
</head>

<template id="pagina-rescisao">
<header class="topo">
    <div class="topo__conteudo">
      <div class="topo__marca">
        <span class="topo__logo">§</span>
        <div>
          <h1>Cálculos Trabalhistas</h1>
          <p id="versao">Ferramenta de cálculos trabalhistas</p>
        </div>
      </div>
      <span class="badge" id="badge-vigencia">tabelas</span>
    </div>
    <nav class="abas" aria-label="Módulos">
      <a class="aba aba--ativa" href="#rescisao" data-pagina="rescisao" aria-current="page">Verbas rescisórias</a>
      <a class="aba" href="#pedidos" data-pagina="pedidos">Cálculo de pedidos</a>
    </nav>
  </header>

  <main class="pagina">
    <section class="etapa">
      <h2><span class="etapa__num">1</span> Tipo de rescisão</h2>
      <p class="etapa__ajuda">Selecione a modalidade: os campos e as verbas devidas mudam conforme a escolha.</p>
      <div class="tipos-grupos" id="tipos" data-dinamico role="radiogroup" aria-label="Tipo de rescisão"></div>
      <div class="resumo-tipo" id="resumo-tipo" hidden></div>
    </section>

    <div class="colunas">
      <section class="etapa etapa--form" id="etapa-dados" hidden>
        <h2><span class="etapa__num">2</span> Dados para o cálculo</h2>
        <form id="formulario" autocomplete="off">
          <fieldset class="grupo">
            <legend>Contrato de trabalho</legend>
            <div class="campos">
              <label class="campo">
                <span class="campo__rotulo">Data de admissão <b>*</b></span>
                <input type="text" inputmode="numeric" data-campo="data" maxlength="10" placeholder="dd/mm/aaaa" id="dataAdmissao" />
              </label>
              <label class="campo" id="campo-termo-final" hidden>
                <span class="campo__rotulo">Data do termo final previsto <b>*</b></span>
                <input type="text" inputmode="numeric" data-campo="data" maxlength="10" placeholder="dd/mm/aaaa" id="dataTermoFinal" />
                <span class="campo__dica">Data combinada para o fim do contrato (experiência: até 90 dias).</span>
              </label>
              <label class="campo" id="campo-data-aviso">
                <span class="campo__rotulo" id="rotulo-data-aviso">Data do aviso prévio / desligamento <b>*</b></span>
                <input type="text" inputmode="numeric" data-campo="data" maxlength="10" placeholder="dd/mm/aaaa" id="dataAviso" />
                <span class="campo__dica" id="dica-data-aviso">Data da comunicação da rescisão.</span>
              </label>
              <label class="campo" id="campo-prejuizo480" hidden>
                <span class="campo__rotulo">Prejuízo comprovado do empregador</span>
                <span class="campo__moeda"><i>R$</i><input type="text" inputmode="decimal" data-campo="moeda" data-min="0" id="prejuizoArt480" placeholder="0,00" /></span>
                <span class="campo__dica">A indenização do art. 480 cobre só o prejuízo que a saída causou, até o que o empregado receberia pelo art. 479 (§1º). Sem prejuízo, nada se desconta.</span>
              </label>
              <label class="campo campo--largo checkbox" id="campo-clausula" hidden>
                <input type="checkbox" id="clausulaAssecuratoria" />
                <span>Contrato com <b>cláusula assecuratória</b> do direito recíproco de rescisão antecipada (art. 481 da CLT)</span>
              </label>
            </div>
            <div class="campos" id="grupo-aviso" hidden>
              <fieldset class="campo campo--largo opcoes">
                <legend class="campo__rotulo" id="rotulo-aviso">Aviso prévio</legend>
                <div class="opcoes__lista" id="opcoes-aviso"></div>
                <span class="campo__dica" id="dica-aviso"></span>
              </fieldset>
            </div>
          </fieldset>

          <fieldset class="grupo">
            <legend>Prescrição</legend>
            <div class="campos">

 * Teto de dias de aviso prévio que o empregado pode ser obrigado a cumprir em
 * serviço. A proporcionalidade da Lei 12.506/2011 é benefício do trabalhador,
 * de modo que o excedente é indenizado (Nota Técnica 184/2012 da SRT/MTE).
 */
const DIAS_AVISO_TRABALHAVEIS = 30;

function addDias(data, dias) {
  return new Date(data.getTime() + dias * DIA_MS);
}

/** Soma meses mantendo o dia; dia inexistente no mês de destino encosta no último. */
function addMeses(data, meses) {
  const ano = data.getUTCFullYear();
  const mes = data.getUTCMonth() + meses;
  const ultimoDia = new Date(Date.UTC(ano, mes + 1, 0)).getUTCDate();
  return new Date(Date.UTC(ano, mes, Math.min(data.getUTCDate(), ultimoDia)));
}

function addAnos(data, anos) {
  return new Date(Date.UTC(data.getUTCFullYear() + anos, data.getUTCMonth(), data.getUTCDate()));
}

function diffDias(inicio, fim) {
  return Math.round((fim - inicio) / DIA_MS);
}

/** Dias entre duas datas, contando as duas pontas. */
function diasEntre(inicio, fim) {
  return diffDias(inicio, fim) + 1;
}

function anosCompletos(admissao, fim) {
  let anos = fim.getUTCFullYear() - admissao.getUTCFullYear();
  const aniversario = new Date(
    Date.UTC(fim.getUTCFullYear(), admissao.getUTCMonth(), admissao.getUTCDate()),
  );
  if (fim < aniversario) anos -= 1;
  return Math.max(0, anos);
}

/** Meses completos entre duas datas (para contratos com menos de um ano). */
function mesesCompletos(inicio, fim) {
  let meses =
    (fim.getUTCFullYear() - inicio.getUTCFullYear()) * 12 + (fim.getUTCMonth() - inicio.getUTCMonth());
  if (fim.getUTCDate() < inicio.getUTCDate()) meses -= 1;
  return Math.max(0, meses);
}

/** Conta os meses de competência com 15 dias ou mais trabalhados. */
function contarMeses(inicio, fim) {
  if (!inicio || !fim || fim < inicio) return 0;
  let meses = 0;
  let cursor = new Date(Date.UTC(inicio.getUTCFullYear(), inicio.getUTCMonth(), 1));
  while (cursor <= fim) {
    const primeiro = cursor;
    const ultimo = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth() + 1, 0));
    const de = inicio > primeiro ? inicio : primeiro;
    const ate = fim < ultimo ? fim : ultimo;
    if (diffDias(de, ate) + 1 >= 15) meses += 1;
    cursor = new Date(Date.UTC(cursor.getUTCFullYear(), cursor.getUTCMonth() + 1, 1));
  }
  return meses;
}

/** Avos do 13º: meses de competência do ano, limitados a 12. */
function contarAvos(inicio, fim) {
  return Math.min(contarMeses(inicio, fim), 12);
}

/**
 * Avos de férias: contados em ciclos mensais a partir do dia da admissão, e
 * não por mês de calendário (art. 130 c/c art. 146, parágrafo único, da CLT).
 *
 * O ciclo em curso na saída só vira avo se tiver 15 dias ou mais trabalhados
 * dentro dele — a fração superior a 14 dias —, pouco importando quantos dias
 * do mês de calendário foram cumpridos.
 *
 * @param {Date} inicioPeriodo início do período aquisitivo em curso
 * @param {Date} fim último dia do contrato, já projetado quando há aviso
 */
function contarAvosFerias(inicioPeriodo, fim) {
  if (!inicioPeriodo || !fim || fim < inicioPeriodo) return 0;

  let avos = 0;
  for (let ciclo = 0; ciclo < 12; ciclo += 1) {
    const inicioCiclo = addMeses(inicioPeriodo, ciclo);
    const fimCiclo = addDias(addMeses(inicioPeriodo, ciclo + 1), -1);

    if (fim >= fimCiclo) {
      avos += 1; // ciclo mensal completo
      continue;
    }
    if (diffDias(inicioCiclo, fim) + 1 >= 15) avos += 1; // fração superior a 14 dias
    break;
  }
  return Math.min(avos, 12);
}

/** Períodos aquisitivos de férias já completados e início do período em curso. */
function periodosAquisitivos(admissao, fim) {
  let completos = 0;
  let inicio = admissao;
  while (true) {
    const fimPeriodo = addDias(addAnos(inicio, 1), -1);
    if (fimPeriodo <= fim) {
      completos += 1;
      inicio = addAnos(inicio, 1);
    } else {
      break;
    }
  }
  return { completos, inicioPeriodoAtual: inicio };
}

/**
 * Valor das horas extras do mês: hora normal — salário e adicionais divididos
 * pelo divisor da jornada (Súmula 264 do TST) — acrescida do adicional.
 */
function valorHorasExtras(remuneracaoFixa, divisor, horas, percentual = 50) {
  if (!divisor || divisor <= 0 || !horas || horas <= 0) return 0;
  return arredondar((remuneracaoFixa / divisor) * (1 + percentual / 100) * horas);
}

/** Dias de férias a que o empregado faz jus conforme faltas (art. 130 da CLT). */
function diasDeFeriasPorFaltas(faltas = 0) {
  if (faltas <= 5) return 30;
  if (faltas <= 14) return 24;
  if (faltas <= 23) return 18;
  if (faltas <= 32) return 12;
  return 0;
}

/* ------------------------------------------------------------- tributação */

function calcularINSS(base) {
  if (base <= 0) return 0;
  let contribuicao = 0;
  let anterior = 0;
  for (const faixa of INSS.faixas) {
    if (base > anterior) {
      const parcela = Math.min(base, faixa.limite) - anterior;
      contribuicao += parcela * faixa.aliquota;
      anterior = faixa.limite;
    }
  }
  return arredondar(contribuicao);
}

function impostoPelaTabela(base) {
  const faixa = IRRF.faixas.find((f) => base <= f.limite) ?? IRRF.faixas.at(-1);
  return Math.max(0, base * faixa.aliquota - faixa.deducao);
}

/**
 * Redutor da Lei 15.270/2025: zera o imposto até R$ 5.000,00 de rendimento
 * mensal e decresce linearmente até se anular em R$ 7.350,00.
 *
 * @param {number} rendimento rendimento tributável bruto do mês
 * @param {number} imposto imposto apurado pela tabela
 */
function calcularRedutorIRRF(rendimento, imposto) {
  const { isencaoAte, limite, constante, fator } = IRRF.redutor;
  if (rendimento <= isencaoAte) return imposto; // isenção integral
  if (rendimento > limite) return 0;
  return Math.max(0, constante - fator * rendimento);
}

/**
 * IRRF pelo modelo mais favorável — deduções legais x desconto simplificado —,
 * já descontado o redutor da Lei 15.270/2025.
 */
function calcularIRRF(rendimento, { inss = 0, dependentes = 0, pensao = 0 } = {}) {
  if (rendimento <= 0) return 0;
  const baseLegal = rendimento - inss - dependentes * IRRF.deducaoPorDependente - pensao;
  // O desconto simplificado é valor fixo e substitui todas as deduções legais.
  const baseSimplificada = rendimento - IRRF.descontoSimplificado;
  const imposto = Math.min(impostoPelaTabela(baseLegal), impostoPelaTabela(baseSimplificada));
  return arredondar(Math.max(0, imposto - calcularRedutorIRRF(rendimento, imposto)));
}

/* ---------------------------------------------------------------- cálculo */

function arredondar(valor) {
  return Math.round((valor + Number.EPSILON) * 100) / 100;
}

function num(valor) {
  const n = Number(valor);
  return Number.isFinite(n) ? n : 0;
}

/**
 * Limita os descontos da rescisão, em duas camadas.
 *
 * 1. **Art. 477, §5º, da CLT**: "qualquer compensação" no acerto não passa de
 *    um mês de remuneração. A SDI-1 do TST aplica o teto a toda compensação,
 *    qualquer que seja a natureza — aviso não cumprido, art. 480, horas
 *    negativas, adiantamentos e outros débitos. INSS e IRRF são retenções
 *    legais, e a pensão é ordem judicial em favor de terceiro: nenhum dos três
 *    é compensação, e ficam fora do teto.
 * 2. **Saldo**: o acerto não termina com o empregado devendo. O que as verbas
 *    não comportam fica de fora — primeiro das compensações, depois da pensão.
 *
 * O corte começa pelo último desconto lançado. Os itens reduzidos ganham uma
 * nota no detalhe; o valor que sobra é do empregador cobrar por outra via.
 *
 * @param {object[]} descontos alterados no lugar
 * @returns {{naoAbatido: number, excessoDoLimite: number, faltaDeSaldo: number}}
 */
function limitarDescontos(descontos, { proventos, limite }) {
  const soma = (natureza) => arredondar(
    descontos.filter((d) => d.natureza === natureza).reduce((t, d) => t + d.valor, 0),
  );
  const cortar = (naturezas, quanto, nota) => {
    let resta = arredondar(quanto);
    for (const item of [...descontos].reverse()) {
      if (resta <= 0) break;
      if (!naturezas.includes(item.natureza) || item.valor <= 0) continue;
      const corte = Math.min(item.valor, resta);
      item.valor = arredondar(item.valor - corte);
      item.detalhe = `${item.detalhe} · ${moeda.format(corte)} fora do acerto (${nota})`;
      resta = arredondar(resta - corte);
    }
    return arredondar(quanto - resta);
  };

  const excessoDoLimite = Math.max(0, arredondar(soma('compensacao') - limite));
  if (excessoDoLimite > 0) cortar(['compensacao'], excessoDoLimite, 'art. 477, §5º');

  const total = arredondar(descontos.reduce((t, d) => t + d.valor, 0));
  const faltaDeSaldo = Math.max(0, arredondar(total - proventos));
  if (faltaDeSaldo > 0) cortar(['compensacao', 'pensao'], faltaDeSaldo, 'sem saldo no acerto');

  // Itens zerados pelo corte não somem: a nota explica por que valem zero.
  return { naoAbatido: arredondar(excessoDoLimite + faltaDeSaldo), excessoDoLimite, faltaDeSaldo };
}

/**
 * @param {object} dados campos do formulário (ver `campos.js` / `app.js`)
 * @returns {{erros:string[], contexto:object, proventos:object[], descontos:object[], fgts:object, totais:object}}
 */
function calcularRescisao(dados) {
  const tipo = TIPOS[dados.tipo];
  const erros = [];
  if (!tipo) erros.push('Selecione o tipo de rescisão.');

  const campos = tipo?.campos ?? {};
  const admissao = parseData(dados.dataAdmissao);
  const termoFinal = parseData(dados.dataTermoFinal);
  // No término no prazo, o próprio termo final encerra o contrato.
  const dataAviso = campos.termoEncerraContrato ? termoFinal : parseData(dados.dataAviso);

  if (!admissao) erros.push('Informe a data de admissão.');
  if (campos.termoFinal && !termoFinal) erros.push('Informe a data do termo final previsto.');
  if (!dataAviso && !campos.termoEncerraContrato) erros.push('Informe a data do aviso prévio / desligamento.');
  if (admissao && dataAviso && dataAviso < admissao) {
    erros.push('A data do desligamento não pode ser anterior à admissão.');
  }
  if (admissao && termoFinal && termoFinal <= admissao) {
    erros.push('O termo final deve ser posterior à data de admissão.');
  }
  if (campos.termoFinal && !campos.termoEncerraContrato && dataAviso && termoFinal && dataAviso >= termoFinal) {
    erros.push('A rescisão antecipada deve ocorrer antes do termo final previsto.');
  }

  // O salário só é cobrado depois da prescrição: as datas bastam para apurar
  // o biênio, e de um contrato prescrito nenhum valor serve.
  const salarioBase = num(dados.salarioBase);

  const ajuizamento = parseData(dados.dataAjuizamento);
  if (admissao && ajuizamento && ajuizamento < admissao) {
    erros.push('A data do ajuizamento não pode ser anterior à admissão.');
  }

  if (erros.length) {
    // Com as datas incompletas não há prescrição a apurar, então vale mostrar
    // de uma vez tudo o que falta — inclusive o salário.
    if (salarioBase <= 0) erros.push('Informe o último salário base.');
    return {
      erros, alertas: [], impedimento: null, recorte: null,
      proventos: [], descontos: [], totais: null, contexto: null, fgts: null,
    };
  }
  const alertas = [];

  const divisor = num(dados.divisor) || DIVISOR_PADRAO;

  // Os adicionais legais vêm marcados na tela, cada um com o seu percentual.
  const adicionais = calcularAdicionais({
    selecionados: dados.adicionais ?? [],
    salarioBase,
    horasNoturnas: num(dados.horasNoturnas),
    divisor,
  });
  // Duas bases: a fixa é o que o mês paga (salário e adicionais), e é sobre ela
  // que o saldo de salário é rateado. As médias de variáveis servem para
  // integrar as indenizações — aviso, 13º e férias —, não para inflar o mês.
  const remuneracaoFixa = arredondar(salarioBase + adicionais.total);
  const medias = num(dados.mediaComissoes);
  const remuneracao = arredondar(remuneracaoFixa + medias);

  /* --- aviso prévio --- */
  const anos = anosCompletos(admissao, dataAviso);

  // A cláusula assecuratória (art. 481) faz o contrato a termo seguir as regras
  // do contrato por prazo indeterminado: há aviso prévio e não incidem os
  // arts. 479/480.
  const clausulaAtiva = Boolean(campos.clausulaAssecuratoria && dados.clausulaAssecuratoria);
  const avisoAplicavel = Boolean(tipo.aviso && (!tipo.aviso.somenteComClausula || clausulaAtiva));
  const opcoesAviso = avisoAplicavel ? tipo.aviso.opcoes.map((o) => o.valor) : [];
  const tipoAviso = avisoAplicavel
    ? (opcoesAviso.includes(dados.tipoAviso) ? dados.tipoAviso : opcoesAviso[0])
    : 'nenhum';

  const diasAvisoLegais = avisoAplicavel
    ? (tipo.aviso.diasFixos ?? Math.min(30 + 3 * anos, 90))
    : 0;

  let diasAvisoDevidos = diasAvisoLegais;
  if (tipoAviso === 'indenizado_metade') diasAvisoDevidos = Math.round(diasAvisoLegais / 2);
  if (tipoAviso === 'nenhum' || tipoAviso === 'dispensado') diasAvisoDevidos = 0;

  const avisoIndenizado = tipoAviso === 'indenizado' || tipoAviso === 'indenizado_metade';
  const avisoTrabalhado = tipoAviso === 'trabalhado';

  // A proporcionalidade da Lei 12.506/2011 existe em favor do empregado: ele
  // não pode ser obrigado a trabalhar mais de 30 dias de aviso, e o que passar
  // disso é indenizado (Nota Técnica 184/2012 da SRT/MTE).
  const diasAvisoTrabalhados = avisoTrabalhado
    ? Math.min(diasAvisoLegais, DIAS_AVISO_TRABALHAVEIS)
    : 0;
  const excedenteTrabalhado = avisoTrabalhado ? diasAvisoLegais - diasAvisoTrabalhados : 0;
  // Dias pagos em dinheiro: o aviso indenizado por inteiro, ou só o excedente
  // quando o aviso é cumprido em serviço.
  const diasAvisoPagos = avisoIndenizado ? diasAvisoDevidos : excedenteTrabalhado;

  // Último dia do contrato e data projetada (o aviso indenizado integra o
  // tempo de serviço — OJ 82 da SDI-1 e Súmula 305 do TST).
  const ultimoDiaTrabalhado = avisoTrabalhado ? addDias(dataAviso, diasAvisoTrabalhados) : dataAviso;
  const dataProjetada = diasAvisoPagos > 0
    ? addDias(ultimoDiaTrabalhado, diasAvisoPagos)
    : ultimoDiaTrabalhado;

  /* --- prescrição bienal (art. 7º, XXIX, da CF) --- */
  // O biênio corre do fim do aviso, e do projetado quando ele é indenizado
  // (OJ 83 da SDI-1): por isso é apurado aqui, e não sobre a data do aviso.
  const bienal = apurarBienal(dataProjetada, ajuizamento, dados.dataReferencia);
  if (bienal.impedimento) {
    return {
      erros: [],
      alertas: [],
      impedimento: bienal.impedimento,
      recorte: null,
      proventos: [],
      descontos: [],
      fgts: null,
      totais: null,
      contexto: { dataProjetada, ajuizamento, limiteBienal: bienal.limite },
    };
  }
  if (bienal.alerta) alertas.push(bienal.alerta);
  if (ajuizamento && ajuizamento < dataAviso) {
    alertas.push('A data do ajuizamento é anterior ao fim do contrato. Confira as datas.');
  }

  // Afastada a prescrição bienal, agora sim o salário é indispensável. Os
  // avisos já apurados seguem junto, para a tela mostrá-los desde as datas.
  if (salarioBase <= 0) {
    return {
      erros: ['Informe o último salário base.'], alertas: [...alertas], impedimento: null, recorte: null,
      proventos: [], descontos: [], totais: null, contexto: null, fgts: null,
    };
  }

  if (excedenteTrabalhado > 0) {
    alertas.push(
      `O aviso proporcional é de ${diasAvisoLegais} dias, mas o empregado só pode ser obrigado a `
        + `cumprir ${DIAS_AVISO_TRABALHAVEIS} em serviço: os ${excedenteTrabalhado} dias restantes foram `
        + 'lançados como indenizados e projetam o contrato (Nota Técnica 184/2012 da SRT/MTE).',
    );
  }

  /* --- proventos --- */
  const proventos = [];
  const descontosAntecipados = [];
  // Dias do último mês: conta a partir da admissão quando ela cai nesse mesmo
  // mês, e paga o mês cheio (30/30) quando ele foi trabalhado por inteiro —
  // inclusive em fevereiro, que tem menos de 30 dias.
  const anoSaldo = ultimoDiaTrabalhado.getUTCFullYear();
  const mesSaldo = ultimoDiaTrabalhado.getUTCMonth();
  const primeiroDoMes = new Date(Date.UTC(anoSaldo, mesSaldo, 1));
  const ultimoDoMes = new Date(Date.UTC(anoSaldo, mesSaldo + 1, 0));
  const inicioNoMes = admissao > primeiroDoMes ? admissao : primeiroDoMes;
  const mesInteiro = admissao <= primeiroDoMes && ultimoDiaTrabalhado >= ultimoDoMes;
  const diasSaldo = mesInteiro ? 30 : Math.min(diffDias(inicioNoMes, ultimoDiaTrabalhado) + 1, 30);

  const saldoSalario = arredondar((remuneracaoFixa / 30) * diasSaldo);
  proventos.push({
    chave: 'saldo_salario',
    label: 'Saldo de salário',
    detalhe: `${diasSaldo} dia(s) de ${formatarData(ultimoDiaTrabalhado).slice(3)} · salário e adicionais`,
    valor: saldoSalario,
  });

  // Horas extras efetivamente prestadas no mês da rescisão: verba do mês, e
  // não média de integração.
  const horasExtras = num(dados.horasExtras);
  const percentualHoraExtra = num(dados.adicionalHoraExtra) || 50;
  const valorHoras = valorHorasExtras(remuneracaoFixa, divisor, horasExtras, percentualHoraExtra);
  if (valorHoras > 0) {
    proventos.push({
      chave: 'horas_extras',
      label: 'Horas extras',
      detalhe: `${formatarQuantidade(horasExtras)} h x ${moeda.format(
        arredondar((remuneracaoFixa / divisor) * (1 + percentualHoraExtra / 100)),
      )} (hora + ${formatarQuantidade(percentualHoraExtra)}%)`,
      valor: valorHoras,
    });
  }

  let valorAviso = 0;
  if (diasAvisoPagos > 0) {
    valorAviso = arredondar((remuneracao / 30) * diasAvisoPagos);
    const rotuloAviso = excedenteTrabalhado > 0
      ? 'Aviso prévio indenizado (excedente dos 30 dias trabalhados)'
      : (tipoAviso === 'indenizado_metade' ? 'Aviso prévio indenizado (50%)' : 'Aviso prévio indenizado');
    const detalheAviso = excedenteTrabalhado > 0
      ? `${diasAvisoPagos} dias além dos ${diasAvisoTrabalhados} cumpridos (de ${diasAvisoLegais} proporcionais)`
      : `${diasAvisoPagos} dias${tipoAviso === 'indenizado_metade' ? ` (metade de ${diasAvisoLegais})` : ''}`;
    proventos.push({
      chave: 'aviso_previo',
      label: rotuloAviso,
      detalhe: detalheAviso,
      valor: valorAviso,
    });
  }

  /* --- rescisão antecipada do contrato a termo (arts. 479 e 480) --- */
  const diasRestantes = termoFinal ? Math.max(0, diffDias(ultimoDiaTrabalhado, termoFinal)) : 0;
  const regraIndenizacao = tipo.indenizacaoAntecipada;
  let indenizacaoAntecipada = 0;
  let tetoArt480 = 0;
  if (regraIndenizacao && !clausulaAtiva && diasRestantes > 0) {
    // Metade da remuneração dos dias que faltavam até o termo final.
    const metadeDoRestante = arredondar(((remuneracao / 30) * diasRestantes) / 2);
    if (regraIndenizacao.natureza === 'provento') {
      // Art. 479: devida pelo empregador, sem prova de nada.
      indenizacaoAntecipada = metadeDoRestante;
      proventos.push({
        chave: `indenizacao_art_${regraIndenizacao.artigo}`,
        label: regraIndenizacao.label,
        detalhe: `metade de ${diasRestantes} dia(s) até ${formatarData(termoFinal)}`,
        valor: indenizacaoAntecipada,
      });
    } else {
      // Art. 480: o empregado indeniza os *prejuízos* que a saída causou, e o
      // art. 479 é só o teto (§1º). Sem prejuízo comprovado, nada se desconta.
      tetoArt480 = metadeDoRestante;
      const prejuizo = num(dados.prejuizoArt480);
      indenizacaoAntecipada = arredondar(Math.min(prejuizo, tetoArt480));
      if (indenizacaoAntecipada > 0) {
        descontosAntecipados.push({
          chave: `indenizacao_art_${regraIndenizacao.artigo}`,
          label: regraIndenizacao.label,
          natureza: 'compensacao',
          detalhe: prejuizo > tetoArt480
            ? `prejuízo de ${moeda.format(prejuizo)} limitado ao teto de ${moeda.format(tetoArt480)} (art. 480, §1º)`
            : `prejuízo comprovado, dentro do teto de ${moeda.format(tetoArt480)} (art. 480, §1º)`,
          valor: indenizacaoAntecipada,
        });
      } else {
        alertas.push(
          'A indenização do art. 480 só é devida se o empregador comprovar prejuízo com a saída '
            + `antecipada, e fica limitada a ${moeda.format(tetoArt480)} — o que o empregado receberia pelo `
            + 'art. 479. Nenhum prejuízo foi informado, e por isso nada foi descontado.',
        );
      }
    }
  }

  /* --- 13º proporcional --- */
  let decimoTerceiro = 0;
  let avos13 = 0;
  let avos13AnoSeguinte = 0;
  // Cada ano tem o seu 13º, tributado como fato próprio.
  const decimosPorAno = [];
  if (tipo.campos.decimoTerceiro) {

        `A ciência da incapacidade (${formatarData(ciencia)}) é anterior à EC 45/2004. Nesse caso o TST `
          + 'aplica a prescrição do Código Civil, com a regra de transição do art. 2.028, e não a do '
          + 'art. 7º, XXIX, da CF. Confira o prazo à parte: o cálculo não o apura.',
      ],
    };
  }

  const cienciaDepois = Boolean(ciencia && extincao && ciencia > extincao);
  const bienal = apurarBienal(cienciaDepois ? ciencia : extincao, ajuizamento, hoje);
  const limiteQuinquenal = ciencia ? somarAnos(ciencia, 5) : null;

  if (bienal.impedimento) {
    return {
      ...vazio,
      impedimento: cienciaDepois
        ? {
          ...bienal.impedimento,
          mensagem: `A ciência da incapacidade veio em ${formatarData(ciencia)}, depois do fim do contrato, `
            + `e é dela que corre o biênio (Súmula 278 do STJ), encerrado em ${formatarData(bienal.limite)}. `
            + `A ação só foi ajuizada em ${formatarData(ajuizamento)}: a pretensão está prescrita `
            + '(art. 7º, XXIX, da CF).',
        }
        : bienal.impedimento,
    };
  }

  if (ajuizamento && limiteQuinquenal && ajuizamento > limiteQuinquenal) {
    return {
      ...vazio,
      impedimento: {
        integral: true,
        marco: limiteQuinquenal,
        titulo: 'Pretensão atingida pela prescrição quinquenal',
        mensagem: `A ciência inequívoca da incapacidade se deu em ${formatarData(ciencia)} (Súmula 278 do `
          + `STJ) e a ação só foi ajuizada em ${formatarData(ajuizamento)}, depois dos cinco anos que se `
          + `encerraram em ${formatarData(limiteQuinquenal)} (art. 7º, XXIX, da CF). A pretensão `
          + 'indenizatória nasce inteira com a ciência, e por isso prescreve inteira.',
      },
    };
  }

  const limites = [bienal.limite, limiteQuinquenal].filter(Boolean);
  const prazo = limites.length ? limites.reduce(menor) : null;
  const alertas = [];
  if (!ajuizamento && prazo && hoje && hoje > prazo) {
    // O biênio vencido já vem avisado pelo `apurarBienal`; o quinquênio, não.
    if (bienal.alerta) alertas.push(bienal.alerta);
    else {
      alertas.push(`O prazo de cinco anos contado da ciência da incapacidade terminou em `
        + `${formatarData(limiteQuinquenal)}. Se a ação ainda não foi proposta, a pretensão está prescrita `
        + '(art. 7º, XXIX, da CF). Informe a data do ajuizamento para apurar.');
    }
  }
  if (cienciaDepois) {
    alertas.push(`A ciência da incapacidade (${formatarData(ciencia)}) é posterior ao fim do contrato: `
      + 'o biênio corre dela, e não da extinção (Súmula 278 do STJ).');
  }

  let descricao = null;
  if (prazo) {
    descricao = ajuizamento
      ? `ação ajuizada em ${formatarData(ajuizamento)}, dentro do prazo que ia até ${formatarData(prazo)}`
      : `ajuizar até ${formatarData(prazo)} · informe o ajuizamento para apurar`;
    // Só com o biênio, o quinquênio fica por apurar: ele corre da ciência.
    if (!ciencia) descricao += ' · informe a ciência da incapacidade para apurar o quinquênio';
  } else if (ajuizamento) {
    descricao = 'informe a data da ciência da incapacidade para apurar';
  }

  return { impedimento: null, alertas, descricao };
}

/* ------------------------------------------------- percentual da perda --- */

/** Lesões escolhidas na tabela, respeitando o que a tela mostra. */
function lesoesEscolhidas(dados) {
  const ids = [dados.lesao1];
  // A segunda e a terceira só valem enquanto visíveis: uma escolha feita e
  // depois escondida (voltando a segunda para "nenhuma") não pode contar.
  if (dados.lesao2 && dados.lesao2 !== 'nenhuma') {
    ids.push(dados.lesao2);
    if (dados.lesao3 && dados.lesao3 !== 'nenhuma') ids.push(dados.lesao3);
  }
  return ids.map((id, i) => ({ lesao: lesaoPorId(id), grau: dados[`grau${i + 1}`] }))
    .filter((e) => e.lesao);
}

function apurarPercentual(dados, erros, alertas) {
  const criterio = dados.criterio ?? 'dpvat';

  if (criterio === 'laudo') {
    const percentual = num(dados.percentualLaudo);
    if (percentual <= 0) erros.push('Informe o percentual de perda fixado no laudo.');
    return { criterio, percentual: Math.min(100, percentual), lesoes: [], origem: 'Percentual fixado no laudo' };
  }

  if (criterio === 'cif') {
    // O percentual do laudo, quando há, manda: é ele que diz em que faixa a
    // perda está, e o qualificador o acompanha (a tela troca a escolha
    // sozinha). Abaixo de 5%, a CIF não vê deficiência — qualificador 0.
    const informado = num(dados.percentualCif);
    if (informado > 0 && informado < QUALIFICADORES_CIF[1].de) {
      erros.push(`Abaixo de ${QUALIFICADORES_CIF[1].de}%, a CIF classifica a perda como nenhuma deficiência `
        + '(qualificador 0). Para estimar uma perda menor, use o critério "Percentual do laudo".');
      return { criterio, percentual: 0, lesoes: [], origem: 'Qualificador da CIF' };
    }
    const escolhido = qualificadorPorCodigo(dados.qualificadorCif);
    const q = informado > 0 ? classificarCIF(informado) : escolhido;
    if (!q || q.codigo === 0) {
      erros.push('Escolha o qualificador da CIF fixado na perícia.');
      return { criterio, percentual: 0, lesoes: [], origem: 'Qualificador da CIF' };
    }
    if (informado > 0 && escolhido && escolhido.codigo !== q.codigo) {
      alertas.push(`${pct(informado)} está na faixa do qualificador ${q.codigo} da CIF (${q.nome}, `
        + `${q.de}% a ${q.ate}%), e não na do ${escolhido.codigo}: o enquadramento segue o percentual.`);
    }
    const percentual = informado > 0 ? informado : (q.de + q.ate) / 2;
    if (!(informado > 0)) {
      alertas.push(`Sem percentual no laudo, a estimativa usa o meio da faixa do qualificador ${q.codigo} `
        + `da CIF (${q.de}% a ${q.ate}%): ${pct(percentual)}. Se o perito fixou um número, informe-o.`);
    }
    return { criterio, percentual, lesoes: [], origem: `Qualificador ${q.codigo} da CIF (${q.nome})` };
  }

  const escolhidas = lesoesEscolhidas(dados);
  if (!escolhidas.length) {
    erros.push('Escolha a lesão na tabela DPVAT.');
    return { criterio: 'dpvat', percentual: 0, lesoes: [], origem: 'Tabela DPVAT' };
  }

  const lesoes = escolhidas.map(({ lesao, grau }) => {
    const total = eLesaoTotal(lesao.id);
    // A invalidez total não se gradua: a lei só subdivide a parcial.
    const repercussao = total ? REPERCUSSOES[0] : repercussaoPorValor(grau) ?? REPERCUSSOES[0];
    const percentual = (lesao.percentual * repercussao.fator) / 100;
    const conta = repercussao.fator === 100
      ? `${lesao.percentual}%`
      : `${lesao.percentual}% x ${repercussao.fator}% (repercussão ${repercussao.nome}) = ${pct(percentual)}`;
    return { ...lesao, repercussao, percentual, conta };
  });

  const soma = lesoes.reduce((s, l) => s + l.percentual, 0);
  if (soma > 100) {
    alertas.push(`As lesões somam ${pct(soma)}; a perda fica limitada a 100%.`);
  }
  return {
    criterio: 'dpvat',
    percentual: Math.min(100, arredondar(soma)),
    lesoes,
    origem: 'Tabela DPVAT (anexo da Lei 6.194/74)',
  };
}

/* --------------------------------------------------------------- pensão --- */

/**
 * Valor presente de `n` prestações mensais iguais, descontadas a `taxa` ao
 * mês — a fórmula da quitação antecipada de um financiamento, que a 1ª Turma
 * do TST adotou para a pensão paga de uma vez: VP = P x [1 - (1 + i)^-n] / i.
 */
function valorPresente(prestacao, meses, taxaMensal) {
  if (meses <= 0) return 0;
  if (taxaMensal <= 0) return prestacao * meses;
  return (prestacao * (1 - (1 + taxaMensal) ** -meses)) / taxaMensal;
}

function apurarPensao(dados, { remuneracao, percentual, ajuizamento }, erros, alertas) {
  const inicio = parseData(dados.dataCiencia);
  if (!inicio) erros.push('Informe a data da ciência da incapacidade: é dela que a pensão é devida.');

  const unica = (dados.formaPensao ?? 'unica') === 'unica';
  const porIdade = unica && dados.termoFinal === 'idade';
  const porSobrevida = unica && !porIdade;

  // O sexo escolhe a tábua do IBGE: homens e mulheres têm expectativas bem
  // diferentes (aos 34 anos, 42,66 e 47,75), e a de ambos os sexos fica entre
  // elas. Sem ele, nada se consulta na tábua.
  const sexo = sexoPorValor(dados.sexo) ? dados.sexo : null;
  const nomeDaTabua = sexo ? sexoPorValor(sexo).tabua : null;

  const nascimento = parseData(dados.dataNascimento);
  if (nascimento && inicio && nascimento >= inicio) {
    erros.push('A data de nascimento deve ser anterior à da ciência da incapacidade.');
  }
  const idadeNaCiencia = nascimento && inicio && nascimento < inicio ? anosCompletos(nascimento, inicio) : null;

  // A sobrevida sai da tábua do IBGE, na idade da vítima quando a pensão
  // começa. O número digitado prevalece — outra tábua, de outro ano —, mas só
  // enquanto o campo está à vista: escondido, é resto de uma escolha anterior.
  // O mesmo vale para a idade final, que em branco é a expectativa ao nascer.
  const tabua = idadeNaCiencia !== null && sexo ? sobrevidaNaIdade(idadeNaCiencia, sexo) : null;
  const informada = porSobrevida ? num(dados.sobrevida) : 0;
  const sobrevida = informada > 0 ? informada : tabua?.anos ?? 0;
  const idadeFinalInformada = porIdade ? num(dados.idadeFinal) : 0;
  const idadeFinal = idadeFinalInformada > 0 ? idadeFinalInformada : sexo ? arredondar(expectativaAoNascer(sexo)) : 0;

  const pedeSexo = 'Escolha o sexo da vítima: a tábua do IBGE traz uma expectativa para homens, outra para '
    + 'mulheres e a geral, de ambos os sexos.';
  let termo = null;
  if (porIdade) {
    if (!nascimento) erros.push('Informe a data de nascimento para contar a idade final da pensão.');
    if (!idadeFinal) erros.push(`${pedeSexo} Ou informe a idade final.`);
    if (nascimento && idadeFinal) termo = somarAnosFracionados(nascimento, idadeFinal);
  } else if (porSobrevida && !(informada > 0)) {
    if (!nascimento) {
      erros.push('Informe a data de nascimento: a expectativa de sobrevida sai da tábua do IBGE, na idade '
        + 'da vítima na data da ciência. Ou digite a sobrevida de outra tábua.');
    }
    if (!sexo) erros.push(`${pedeSexo} Ou digite a sobrevida de outra tábua.`);
    if (tabua && inicio) termo = somarAnosFracionados(inicio, tabua.anos);
  } else if (porSobrevida && inicio) {
    termo = somarAnosFracionados(inicio, informada);
  }
  if (inicio && termo && termo <= inicio) {
    erros.push(`A idade final (${curto(idadeFinal)} anos) já tinha sido alcançada na data da `
      + 'ciência. Use a expectativa de sobrevida da tábua do IBGE para a idade da vítima.');
  }
  if (erros.length) return null;

  if (tabua?.grupoAberto && ((porSobrevida && !(informada > 0)) || !unica)) {
    alertas.push(`Aos ${tabua.idade} anos, a tábua do IBGE (${nomeDaTabua}) só traz o grupo aberto `
      + `"90 ou mais", com sobrevida de ${curto(tabua.anos)} anos.`);
  }
  // Idade final abaixo do que a tábua projeta para a vítima: a expectativa ao
  // nascer subestima a de quem já passou da infância, e o erro é comum.
  const idadeProjetada = tabua ? idadeNaCiencia + tabua.anos : null;
  if (porIdade && idadeProjetada && idadeFinal < idadeProjetada - 0.5) {
    alertas.push(`Pela tábua do IBGE de ${TABUA_IBGE.ano} (${nomeDaTabua}), aos ${idadeNaCiencia} anos a `
      + `sobrevida é de ${curto(tabua.anos)} anos: a vítima viveria até os ${curto(idadeProjetada)}, mais que `
      + `a idade final (${curto(idadeFinal)}). A expectativa ao nascer subestima a de quem já passou da `
      + 'infância; o termo pela sobrevida é o que a tábua indica para a idade da vítima.');
  }

  const integral = Boolean(dados.incapacidadeTotalOficio);
  const percentualPensao = integral ? 100 : percentual;
  const com13 = dados.incluir13 !== false;
  const comTerco = dados.incluirTerco !== false;
  const base = (remuneracao * percentualPensao) / 100;
  const acrescimos = [com13 && '1/12 de 13º', comTerco && '1/12 do terço de férias'].filter(Boolean);
  const mensal = arredondar(base * (1 + (com13 ? 1 / 12 : 0) + (comTerco ? 1 / 36 : 0)));

  // Vencidas: da ciência até a véspera do cálculo — na inicial, o
  // ajuizamento; depois dele, a data escolhida; sem nada, hoje.
  const corte = parseData(dados.dataCalculo) ?? ajuizamento ?? parseData(dados.dataReferencia);
  const limiteVencidas = termo && corte ? menor(corte, termo) : corte;
  const mesesVencidos = limiteVencidas && limiteVencidas > inicio
    ? contarPeriodo(inicio, menosUmDia(limiteVencidas)).meses
    : 0;
  const vencidas = arredondar(mensal * mesesVencidos);

  const contexto = {
    remuneracao, percentualPensao, integral, mensal, acrescimos, inicio, corte, unica, termo,
    mesesVencidos, vencidas, nascimento, idadeNaCiencia,
    idadeFinal: porIdade ? idadeFinal : null,
    idadeFinalDaTabua: porIdade && !(idadeFinalInformada > 0),
    sobrevida: porSobrevida ? sobrevida : null,
    sobrevidaInformada: porSobrevida && informada > 0,
    sexo,
    nomeDaTabua,
    tabua: tabua ? { ...tabua, ano: TABUA_IBGE.ano } : null,
    idadeNoTermo: porIdade ? idadeFinal : porSobrevida && idadeNaCiencia !== null ? idadeNaCiencia + sobrevida : null,
    // Na pensão mensal não há termo, porque ela é vitalícia; a tábua dá só a
    // duração provável, para informação.
    duracaoProvavel: !unica && tabua ? somarAnosFracionados(inicio, tabua.anos) : null,
  };

  if (!unica) {
    // Pensão mensal vitalícia: no valor do pedido entram as vencidas e doze
    // vincendas, por ser obrigação de prazo indeterminado (art. 292, §§1º e
    // 2º, do CPC, c/c art. 840, §1º, da CLT).
    return { ...contexto, mesesVincendos: 12, nominalVincendas: arredondar(mensal * 12), vincendas: arredondar(mensal * 12) };
  }

  const inicioVincendas = corte ? maior(corte, inicio) : inicio;
  const mesesVincendos = termo > inicioVincendas
    ? contarPeriodo(inicioVincendas, menosUmDia(termo)).meses
    : 0;
  if (corte && termo <= corte) {
    alertas.push(`O termo final estimado (${formatarData(termo)}) já passou na data do cálculo: todas as `
      + 'parcelas estão vencidas. Como a pensão da vítima é vitalícia, as seguintes continuam devidas mês a mês.');
  }
  if (corte && inicio > corte) {
    alertas.push('A ciência da incapacidade é posterior à data do cálculo: todas as parcelas são vincendas.');
  }

  const nominalVincendas = arredondar(mensal * mesesVincendos);
  const porDesagio = dados.metodoDesconto === 'desagio';
  const taxa = dados.taxaJuros === undefined || dados.taxaJuros === '' ? TAXA_VALOR_PRESENTE : num(dados.taxaJuros);
  const desagio = dados.desagio === undefined || dados.desagio === '' ? DESAGIO_PADRAO : num(dados.desagio);
  const vincendas = porDesagio
    ? arredondar(nominalVincendas * (1 - desagio / 100))
    : arredondar(valorPresente(mensal, mesesVincendos, taxa / 100));
  const desagioEfetivo = nominalVincendas > 0 ? (1 - vincendas / nominalVincendas) * 100 : 0;

  return {
    ...contexto, mesesVincendos, nominalVincendas, vincendas, porDesagio, taxa, desagio, desagioEfetivo,
  };
}

/* ------------------------------------------------------------- cálculo --- */

function calcularAcidente(dados) {
  const erros = [];
  const alertas = [];

  // Prescrição primeiro: as datas bastam, e de uma pretensão prescrita
  // nenhum valor serve.
  const prescricao = apurarPrescricaoAcidentaria(dados);
  if (prescricao.impedimento) return resultadoImpedido(prescricao.impedimento);
  const comPrescricao = (lista) => ({ ...resultadoComErros(lista), alertas: prescricao.alertas });

  const pedePensao = dados.pedirPensao !== false;
  const pedeMorais = dados.pedirMorais !== false;
  const pedeEsteticos = Boolean(dados.pedirEsteticos);
  const emergentes = num(dados.danosEmergentes);
  if (!pedePensao && !pedeMorais && !pedeEsteticos && emergentes <= 0) {
    return comPrescricao(['Escolha ao menos uma indenização: pensão, danos morais, estéticos ou despesas.']);
  }

  const salario = num(dados.salarioBase);
  const remuneracao = arredondar(salario + num(dados.outrasParcelas));
  if ((pedePensao || pedeMorais || pedeEsteticos) && salario <= 0) {
    erros.push('Informe o último salário contratual da vítima.');
  }

  // O percentual da perda mede a pensão e orienta o dano moral; o estético e
  // as despesas não dependem dele.
  const perda = pedePensao || pedeMorais ? apurarPercentual(dados, erros, alertas) : null;
  const qualificador = perda ? classificarCIF(perda.percentual) : null;

  const multiplicadorEsteticos = num(dados.multiplicadorEsteticos);
  if (pedeEsteticos && multiplicadorEsteticos <= 0) {
    erros.push('Informe em quantos salários estimar o dano estético.');
  }

  const ajuizamento = parseData(dados.dataAjuizamento);
  const pensao = pedePensao && !erros.length
    ? apurarPensao(dados, { remuneracao, percentual: perda.percentual, ajuizamento }, erros, alertas)
    : null;
  if (pedePensao && !pensao && !erros.length) erros.push('Não foi possível apurar a pensão.');
  if (erros.length) return comPrescricao(erros);

  const itens = [];
  if (pensao) {
    if (pensao.integral) {
      alertas.push('Marcada a incapacidade total para o ofício: a pensão corresponde à remuneração inteira '
        + '(art. 950 do CC — "importância do trabalho para que se inabilitou"), ainda que a vítima possa '
        + 'exercer outra atividade. O percentual da tabela segue orientando o dano moral.');
    }
    const periodoVencido = pensao.mesesVencidos > 0
      ? `${curto(pensao.mesesVencidos)} meses de ${moeda.format(pensao.mensal)}, `
        + `de ${formatarData(pensao.inicio)} até a véspera de ${formatarData(pensao.unica && pensao.termo < pensao.corte
          ? pensao.termo : pensao.corte)}`
      : null;
    if (periodoVencido) {
      itens.push({ chave: 'pensao_vencida', label: 'Pensão vencida (art. 950 do CC)', detalhe: periodoVencido,
        valor: pensao.vencidas });
    }
    if (pensao.unica && pensao.mesesVincendos > 0) {
      itens.push({
        chave: 'pensao_vincenda',
        label: 'Pensão vincenda em parcela única (art. 950, parágrafo único, do CC)',
        detalhe: `${curto(pensao.mesesVincendos)} meses de ${moeda.format(pensao.mensal)} = `
          + `${moeda.format(pensao.nominalVincendas)}, ${pensao.porDesagio
            ? `com deságio de ${pct(pensao.desagio)}`
            : `trazidos a valor presente a ${curto(pensao.taxa)}% ao mês`}`,
        valor: pensao.vincendas,
      });
    } else if (!pensao.unica) {
      itens.push({
        chave: 'pensao_vincenda',
        label: 'Pensão mensal vitalícia — 12 parcelas vincendas',
        detalhe: `${moeda.format(pensao.mensal)} por mês; no valor do pedido entram 12 prestações `
          + '(art. 292, §2º, do CPC)',
        valor: pensao.vincendas,
      });
    }
  }

  if (emergentes > 0) {
    itens.push({ chave: 'danos_emergentes', label: 'Despesas com tratamento (danos emergentes)',
      detalhe: 'Art. 949 do CC — valor informado', valor: arredondar(emergentes) });
  }

  let morais = null;
  if (pedeMorais) {
    const escolhida = dados.naturezaOfensa && dados.naturezaOfensa !== 'auto'
      ? naturezaPorValor(dados.naturezaOfensa) : null;
    const natureza = escolhida ?? naturezaSugerida(qualificador);
    const informado = num(dados.multiplicadorMorais);
    const multiplicador = informado > 0 ? informado : natureza.teto;
    if (multiplicador > natureza.teto) {
      alertas.push(`${curto(multiplicador)} salários superam o teto da ofensa de natureza `
        + `${natureza.nome} (${natureza.teto}). O STF admite ir além, fundamentadamente (ADIs 6050, 6069 e 6082).`);
    }
    morais = { natureza, multiplicador, sugerida: !escolhida, peloTeto: !(informado > 0) };
    itens.push({
      chave: 'danos_morais',
      label: 'Danos morais (art. 223-G da CLT)',
      detalhe: `${curto(multiplicador)} x ${moeda.format(salario)} (último salário contratual) — `
        + `ofensa de natureza ${natureza.nome}, art. 223-G, §1º, ${natureza.inciso}`,
      valor: arredondar(salario * multiplicador),
    });
  }

  if (pedeEsteticos) {
    itens.push({
      chave: 'danos_esteticos',
      label: 'Danos estéticos (Súmula 387 do STJ)',
      detalhe: `${curto(multiplicadorEsteticos)} x ${moeda.format(salario)} (último salário contratual)`,
      valor: arredondar(salario * multiplicadorEsteticos),
    });
  }

  const total = arredondar(itens.reduce((soma, i) => soma + i.valor, 0));

  return {
    erros: [],
    alertas: [...prescricao.alertas, ...alertas],
    impedimento: null,
    recorte: null,
    contexto: {
      semPeriodo: true,
      perda,
      qualificador,
      cif: qualificador ? descreverCIF(qualificador) : null,
      referenciaDpvat: perda ? arredondar((TETO_DPVAT * perda.percentual) / 100) : null,
      salario: arredondar(salario),
      pensao,
      morais,
      prescricao: prescricao.descricao,
    },
    mensais: [],
    periodo: itens,
    fgts: null,
    totais: { mensal: 0, periodo: total, fgts: 0, geral: total },
  };

/* ------------------------------------------------- marcações em grupo ----- */

let adicionaisMarcados = () => [];
let descontosMarcados = () => [];

/**
 * Liga um grupo de marcações que tem uma opção "nenhum" e regras de exclusão
 * entre as demais. Devolve a função que lê o que está marcado.
 */
function ligarGrupo(nome, nenhumId, resolverExclusoes) {
  const inputs = () => [...document.querySelectorAll(`input[name="${nome}"]`)];
  const opcaoNenhum = () => inputs().find((i) => i.value === nenhumId);
  const marcados = () =>
    inputs().filter((i) => i.checked).map((i) => i.value).filter((v) => v !== nenhumId);

  for (const input of inputs()) {
    input.addEventListener('change', () => {
      if (input.checked) {
        const permitidos = resolverExclusoes(marcados(), input.value);
        for (const outro of inputs()) {
          if (outro !== input) outro.checked = permitidos.includes(outro.value);
        }
        if (input.value !== nenhumId) opcaoNenhum().checked = false;
      } else if (marcados().length === 0) {
        // Desmarcar o último equivale a dizer que não havia nenhum.
        opcaoNenhum().checked = true;
      }
      atualizar();
    });
  }
  return marcados;
}

  const opcoes = [{ id: nenhumRotulo.id, label: nenhumRotulo.label }, ...itens];

    .map(
      (o, i) => `
      <label class="opcao">
        <input type="checkbox" name="${nome}" value="${o.id}" ${i === 0 ? 'checked' : ''} />
        ${o.label}

    .join('');

  $('#grupo-fgts').hidden = !campos.fgts;

  $('#campo-clausula').hidden = !campos.clausulaAssecuratoria;
  // No término no prazo é o próprio termo final que encerra o contrato.
  $('#campo-data-aviso').hidden = Boolean(campos.termoEncerraContrato);
  $('#rotulo-data-aviso').innerHTML = `${tipo.rotuloDataAviso ?? 'Data do aviso prévio / desligamento'} <b>*</b>`;
  $('#dica-data-aviso').textContent = tipo.dicaDataAviso ?? 'Data da comunicação da rescisão.';

  // O aviso prévio do contrato a termo só existe com a cláusula do art. 481.
  const clausula = $('#clausulaAssecuratoria').checked && campos.clausulaAssecuratoria;
  $('#grupo-aviso').hidden = !tipo.aviso || (tipo.aviso.somenteComClausula && !clausula);
  // Com a cláusula, o art. 480 dá lugar ao aviso: o prejuízo deixa de importar.
  $('#campo-prejuizo480').hidden = !campos.prejuizo480 || clausula;
}

function montarOpcoesAviso(tipo) {
  if (!tipo.aviso) {
    $('#opcoes-aviso').innerHTML = '';
    return;
  }
  $('#rotulo-aviso').textContent = tipo.aviso.rotulo;
  $('#dica-aviso').textContent = tipo.aviso.ajuda;
  $('#opcoes-aviso').innerHTML = tipo.aviso.opcoes
    .map(
      (opcao, i) => `
      <label class="opcao">
        <input type="radio" name="tipoAviso" value="${opcao.valor}" ${i === 0 ? 'checked' : ''} />
        ${opcao.label}
      </label>`,
    )
    .join('');
  for (const input of $('#opcoes-aviso').querySelectorAll('input')) {
    input.addEventListener('change', atualizar);
  }
}

/* -------------------------------------------------------------- resultado */

function linha(item, negativo = false) {
  return `<tr class="${negativo ? 'neg' : ''}">
    <td>${item.label}${item.detalhe ? `<small>${item.detalhe}</small>` : ''}</td>
    <td>${negativo ? '- ' : ''}${moeda.format(item.valor)}</td>
  </tr>`;
}

/**
 * Resume o aviso prévio em uma linha: quanto foi cumprido em serviço, quanto
 * foi indenizado e quanto foi descontado. O excedente dos 30 dias trabalháveis
 * aparece em separado porque muda a data projetada do contrato.
 */
function descreverAviso(c) {
  if (!c.avisoAplicavel) return 'não devido';
  if (c.tipoAviso === 'nao_cumprido') return `${c.diasAvisoLegais} dias descontados`;
  if (c.tipoAviso === 'dispensado') return 'dispensado, sem desconto';
  if (c.excedenteTrabalhado > 0) {
    return `${c.diasAvisoTrabalhados} trabalhados + ${c.excedenteTrabalhado} indenizados`;
  }
  if (c.tipoAviso === 'trabalhado') return `${c.diasAvisoTrabalhados} dias trabalhados`;
  return c.diasAvisoPagos ? `${c.diasAvisoPagos} dias indenizados` : 'não indenizado';
}

function renderResultado(resultado) {
  const alvo = $('#resultado');

  if (resultado.erros.length) {
    atualizarDicaPeriodos(null);
    // O aviso de biênio vencido já vale com as datas: vem antes do que falta.
    alvo.innerHTML = `${resultado.alertas.map((a) => `<p class="alerta">${a}</p>`).join('')}
      <div class="aviso-erro"><b>Faltam informações para calcular:</b>
      <ul>${resultado.erros.map((e) => `<li>${e}</li>`).join('')}</ul></div>`;
    return;
  }

  // Prescrição bienal é fato impeditivo: nada a calcular, e a caixa vermelha
  // ocupa o lugar do resultado.
  if (resultado.impedimento) {
    atualizarDicaPeriodos(null);
    alvo.innerHTML = `<div class="impedimento" role="alert">
      <b>${resultado.impedimento.titulo}</b>
      <p>${resultado.impedimento.mensagem}</p>
      <p class="impedimento__saida">Os demais campos ficam bloqueados. Corrija as datas do contrato, o tipo de aviso ou a data do ajuizamento para liberar o cálculo.</p>
    </div>`;
    return;
  }

  const { contexto: c, proventos, descontos, totais, fgts } = resultado;
  const tipo = TIPOS[tipoSelecionado];
  atualizarDicaPeriodos(c);

  // Período vencido a mais do que o contrato comporta é erro do campo, não
  // nota de rodapé: fica marcado onde foi digitado.
  marcarErro(
    $('#periodosFeriasVencidas'),
    c.periodosInformados > c.periodosCompletosCalculados
      ? `O contrato completou ${c.periodosCompletosCalculados} período(s) aquisitivo(s).`
      : null,
  );

  const tempoDeServico =
    c.anos >= 1 ? `${c.anos} ano(s)` : c.meses >= 1 ? `${c.meses} mês(es)` : `${c.diasContrato} dia(s)`;

  const contexto = [
    ['Tempo de serviço', tempoDeServico],
    ['Último dia do contrato', formatarData(c.ultimoDiaTrabalhado)],
  ];
  if (tipo.campos.termoFinal) {
    contexto.push(['Termo final previsto', formatarData(c.termoFinal)]);
    // Só faz sentido no encerramento antecipado.
    if (tipo.indenizacaoAntecipada) {
      contexto.push(['Dias até o termo final', `${c.diasRestantes} dia(s)`]);
    }
  }
  contexto.push(
    ['Aviso prévio', descreverAviso(c)],
    ['Data projetada', formatarData(c.dataProjetada)],
    ['Avos de 13º', tipo.campos.decimoTerceiro ? `${c.avos13}/12` : 'não devido'],
    ['Avos de férias', tipo.campos.feriasProporcionais ? `${c.avosFerias}/12` : 'não devido'],
    ['Férias vencidas', c.periodosVencidos
      ? `${c.periodosVencidos} período(s)${c.periodosEmDobro ? `, ${c.periodosEmDobro} em dobro` : ''}`
      : 'nenhum computado'],
    ['Prescrição', c.prescricao],
  );

  alvo.innerHTML = `
    ${resultado.recorte ? `<div class="recorte" role="alert">
      <b>${resultado.recorte.titulo}</b>
      <p>${resultado.recorte.mensagem}</p>
    </div>` : ''}
    ${resultado.alertas.map((a) => `<p class="alerta">${a}</p>`).join('')}
    <dl class="contexto">
      ${contexto.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
    </dl>

    <p class="bloco-titulo">Verbas a receber</p>
    <table class="linhas">
      ${proventos.map((p) => linha(p)).join('')}
      <tr class="total"><td>Total bruto</td><td>${moeda.format(totais.proventos)}</td></tr>
    </table>

    <p class="bloco-titulo">Descontos</p>
    <table class="linhas">
      ${descontos.length ? descontos.map((d) => linha(d, true)).join('') : '<tr><td colspan="2"><small>Sem descontos.</small></td></tr>'}
      <tr class="total"><td>Total de descontos</td><td>${moeda.format(totais.descontos)}</td></tr>
    </table>

    <div class="liquido"><span>Líquido a receber</span><b>${moeda.format(totais.liquido)}</b></div>

    <div class="fgts-card">
      <h3>FGTS</h3>
      ${
        fgts.percentualMulta > 0
          ? `<table class="linhas">
        <tr><td>Saldo informado</td><td>${moeda.format(fgts.informado)}</td></tr>
        <tr><td>FGTS sobre as verbas rescisórias<small>8% sobre saldo, horas extras, 13º e aviso indenizado</small></td><td>${moeda.format(fgts.rescisao)}</td></tr>
        <tr><td>${fgts.rotuloMulta}<small>base ${moeda.format(fgts.baseMulta)}</small></td><td>${moeda.format(fgts.multa)}</td></tr>
      </table>
      <p>Saque: ${fgts.saque} · Seguro-desemprego: ${fgts.seguroDesemprego}</p>
      <p>Valores do FGTS não entram no líquido acima — são liberados pela conta vinculada.</p>`
          : `<p class="fgts-card__nota">${fgts.rotuloMulta}. ${fgts.saque}. Seguro-desemprego: ${fgts.seguroDesemprego}.</p>
      <p>O empregador continua recolhendo o FGTS sobre as verbas salariais, mas o saldo fica retido na conta vinculada.</p>`
      }
    </div>`;
}

/* ------------------------------------------------------------- atualização */

function atualizarDicas(dados) {
  // O divisor precisa vir junto: é ele que define a hora sobre a qual incide o
  // adicional noturno. Sem passá-lo, a dica usava 220 e divergia do cálculo.
  const adicionais = calcularAdicionais({
    selecionados: dados.adicionais,
    salarioBase: dados.salarioBase,
    horasNoturnas: dados.horasNoturnas,
    divisor: dados.divisor || undefined,
  });
  // Base das indenizações: salário, adicionais e médias de variáveis. As horas
  // extras do mês são verba própria e aparecem à parte.
  const remuneracaoFixa = dados.salarioBase + adicionais.total;
  const remuneracao = remuneracaoFixa + dados.mediaComissoes;
  const horasExtras = valorHorasExtras(
    remuneracaoFixa,
    dados.divisor || 220,
    dados.horasExtras,
    dados.adicionalHoraExtra || 50,
  );

  const detalhe = adicionais.itens.length
    ? ` — inclui ${adicionais.itens.map((i) => `${i.label} (${moeda.format(i.valor)})`).join(' e ')}`
    : '';
  $('#nota-remuneracao').innerHTML =
    `Remuneração para cálculo: <b>${moeda.format(remuneracao)}</b>${detalhe}`
    + (horasExtras ? ` · Horas extras do mês: <b>${moeda.format(horasExtras)}</b>` : '');

}

/** Campos que só existem quando a marcação correspondente está ligada. */
function aplicarVisibilidadeMarcacoes() {
  $('#campo-horas-noturnas').hidden = !adicionaisMarcados().some((id) => adicionalPorId(id)?.pedeHoras);

  const marcados = descontosMarcados();
  for (const desconto of DESCONTOS) {
    $(`#campo-${desconto.id}`).hidden = !marcados.includes(desconto.id);
  }
}

/** A contagem de períodos vem do cálculo, para não divergir dele. */
function atualizarDicaPeriodos(contexto) {
  $('#dica-periodos').textContent = contexto
    ? `Períodos aquisitivos completos no contrato: ${contexto.periodosCompletosCalculados}. Informe quantos não foram gozados — a dobra do art. 137 é aplicada sozinha a cada um com o concessivo vencido.`
    : 'Preencha as datas para ver os períodos aquisitivos completos.';
}

/**
 * Bloqueia a digitação quando a prescrição bienal fulmina o pedido.
 *
 * Seguem livres só as entradas que podem afastar o impedimento: as datas, o
 * tipo de aviso (o indenizado projeta o contrato e empurra o biênio) e a
 * cláusula assecuratória, que faz surgir o aviso.
 */
function bloquearEntrada(bloqueado) {
  for (const campo of $('#formulario').querySelectorAll('input, select')) {
    const libera = campo.dataset.campo === 'data'
      || campo.name === 'tipoAviso'
      || campo.id === 'clausulaAssecuratoria';
    campo.disabled = bloqueado && !libera;
  }
  $('#formulario').classList.toggle('formulario--bloqueado', bloqueado);
}

function atualizar() {
  aplicarVisibilidadeMarcacoes();
  const dados = coletarDados();
  atualizarDicas(dados);
  if (!tipoSelecionado) return;
  aplicarVisibilidade(TIPOS[tipoSelecionado]);
  renderResumoTipo(TIPOS[tipoSelecionado]);

  // Campo com conteúdo inválido interrompe o cálculo: o valor seria chute.
  if (dados.errosDeCampo.length) {
    $('#resultado').innerHTML = `<div class="aviso-erro"><b>Corrija os campos destacados:</b>
      <ul>${dados.errosDeCampo.map((e) => `<li>${e}</li>`).join('')}</ul></div>`;
    bloquearEntrada(false);
  } else {
    const resultado = calcularRescisao(dados);
    renderResultado(resultado);
    bloquearEntrada(Boolean(resultado.impedimento));
  }
  // Só se gera PDF de um cálculo fechado.
  $('#gerar-pdf').disabled = Boolean($('#resultado .aviso-erro, #resultado .impedimento'));
}

function gerarPdf() {
  const tipo = TIPOS[tipoSelecionado];
  montarMemoria({
    titulo: 'Verbas rescisórias',
    subtitulo: `${tipo.nome} — ${tipo.tag}`,
    formulario: $('#formulario'),
    resultado: $('#resultado'),
    rodape: 'Uso orientativo. Os valores são estimativas e não substituem o TRCT homologado nem a análise de convenção coletiva, acordo individual ou decisão judicial.',
  });
  imprimir(`Memoria de calculo - ${tipo.nome}`);
}

/* -------------------------------------------------------------- inicializa */

montarTipos();
montarAdicionais();
montarDescontos();
adicionaisMarcados = ligarGrupo('adicionais', SEM_ADICIONAIS, aplicarExclusoes);
descontosMarcados = ligarGrupo('descontos', SEM_DESCONTOS, aplicarExclusoesDesconto);
$('#badge-vigencia').textContent = VIGENCIA;
$('#versao').textContent = `Ferramenta de cálculos trabalhistas — ${CARIMBO}`;
$('#rodape-vigencia').textContent = VIGENCIA_DETALHE;
$('#formulario').addEventListener('input', atualizar);
// Não há botão de calcular: o resultado acompanha a digitação. O submit por
// Enter é neutralizado para que a página nunca recarregue e perca os dados.
$('#formulario').addEventListener('submit', (evento) => {
  evento.preventDefault();
  atualizar();
});
// Limpar também desfaz o bloqueio: sem datas, não há prescrição a apurar.
$('#formulario').addEventListener('reset', () => setTimeout(atualizar, 0));

inicializarCampos();
$('#gerar-pdf').addEventListener('click', gerarPdf);
$('#gerar-pdf').disabled = true;
